<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Reset Password - DevBlog</title>

    <link
        rel="stylesheet"
        href="css/style.css">
      

</head>

<body>

    <div class="auth-container">

        <h1>Reset Password</h1>

        <form id="resetPasswordForm">

            <input
                type="password"
                id="newPassword"
                placeholder="New password"
                required
            >

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                required
            >

            <button type="submit">
                Reset Password
            </button>

        </form>

        <p id="message"></p>

        <a href="login.html">
            Back to Login
        </a>

    </div>

    <script src="js/reset-password.js"></script>

</body>

</html>
